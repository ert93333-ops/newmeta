name: Render Keepalive

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Ping Render service
        env:
          RENDER_KEEPALIVE_URL: ${{ vars.RENDER_KEEPALIVE_URL || secrets.RENDER_KEEPALIVE_URL }}
        run: |
          if [ -z "${RENDER_KEEPALIVE_URL}" ]; then
            echo "RENDER_KEEPALIVE_URL is not set; skipping keepalive ping."
            exit 0
          fi

          BASE_URL="${RENDER_KEEPALIVE_URL%/}"
          case "$BASE_URL" in
            */api/ping) PING_URL="$BASE_URL" ;;
            *) PING_URL="$BASE_URL/api/ping" ;;
          esac

          curl --fail --silent --show-error --max-time 20 --retry 2 --retry-delay 5 "$PING_URL" >/dev/null
