name: Rotate Auth Smoke Password

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Set true to rotate the Supabase Auth smoke user's password to SUPABASE_AUTH_SMOKE_PASSWORD."
        required: true
        type: boolean
        default: false

concurrency:
  group: rotate-auth-smoke-password
  cancel-in-progress: false

jobs:
  rotate:
    if: ${{ inputs.confirm == true }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL || secrets.NEXT_PUBLIC_SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      SUPABASE_AUTH_SMOKE_EMAIL: ${{ secrets.SUPABASE_AUTH_SMOKE_EMAIL }}
      SUPABASE_AUTH_SMOKE_PASSWORD: ${{ secrets.SUPABASE_AUTH_SMOKE_PASSWORD }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: "npm"

      - run: npm ci --include=dev

      - name: Rotate Supabase Auth smoke password
        run: node scripts/rotate-supabase-auth-smoke-password.mjs
